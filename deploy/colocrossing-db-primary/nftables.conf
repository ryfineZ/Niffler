#!/usr/sbin/nft -f

flush table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    iifname "lo" accept
    ct state established,related accept
    ct state invalid drop

    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept

    tcp dport 22 ct state new limit rate 20/minute burst 5 packets accept
    ip saddr { 15.204.120.221, 23.19.228.223, 192.255.151.28 } udp dport 51822 accept

    iifname "wg-db" ip saddr { 10.72.0.3, 10.72.0.4 } tcp dport 6432 accept
    iifname "wg-db" ip saddr 10.72.0.1 tcp dport 55432 accept
  }

  chain forward {
    type filter hook forward priority filter; policy accept;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
