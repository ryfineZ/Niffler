[databases]
aether = host=127.0.0.1 port=55432 dbname=aether pool_mode=session max_db_connections=20
aether_ovh = host=127.0.0.1 port=55432 dbname=aether pool_mode=session max_db_connections=20
aether_background = host=127.0.0.1 port=55432 dbname=aether pool_mode=session max_db_connections=5

[pgbouncer]
listen_addr = 10.72.0.5
listen_port = 6432
unix_socket_dir = /var/run/postgresql
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin

pool_mode = session
max_client_conn = 300
default_pool_size = 40
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3
max_db_connections = 45
max_user_connections = 45
max_prepared_statements = 256
ignore_startup_parameters = extra_float_digits

query_wait_timeout = 120
client_login_timeout = 30
idle_transaction_timeout = 60
server_connect_timeout = 10
server_login_retry = 1
server_idle_timeout = 60
server_lifetime = 3600

client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/tls/server.key
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_protocols = secure
server_tls_sslmode = require
server_tls_protocols = secure

tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_keepcnt = 3
application_name_add_host = 1

logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
verbose = 0
