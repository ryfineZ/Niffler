name: Build App Image

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'test' }}

jobs:
  release_checks:
    name: Verify deployment tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check deployment scripts
        run: |
          bash -n scripts/check-deploy-ancestry.sh
          bash -n scripts/deploy-ci-artifact.sh
          bash -n scripts/fixed-production-deployer.sh
          bash -n scripts/actions-production-ssh-command.sh
          bash -n scripts/actions-production-deploy.sh
          bash -n scripts/install-actions-production-access.sh
          bash -n scripts/verify-ssh-host-key.sh
          bash -n scripts/tests/test-deploy-ancestry.sh
          bash -n scripts/tests/test-app-image-workflow.sh
          bash -n scripts/tests/test-fixed-production-deployer.sh
          bash -n scripts/tests/test-actions-production-access.sh
          bash -n scripts/tests/test-deploy-ci-restricted.sh
          bash -n scripts/tests/test-test-deploy-ci.sh
          bash -n scripts/tests/test-production-workflow.sh
          bash -n scripts/tests/test-verify-ssh-host-key.sh
          bash scripts/tests/test-deploy-ancestry.sh
          bash scripts/tests/test-app-image-workflow.sh
          bash scripts/tests/test-fixed-production-deployer.sh
          bash scripts/tests/test-actions-production-access.sh
          bash scripts/tests/test-deploy-ci-restricted.sh
          bash scripts/tests/test-test-deploy-ci.sh
          bash scripts/tests/test-production-workflow.sh
          bash scripts/tests/test-verify-ssh-host-key.sh

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  gateway:
    name: Build gateway linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-image-x86_64-unknown-linux-musl
          workspaces: . -> target

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build gateway
        env:
          AETHER_VERSION: ${{ github.sha }}
          CARGO_TERM_COLOR: always
        run: cross build --release --locked -p aether-gateway --target x86_64-unknown-linux-musl

      - name: Upload gateway artifact
        uses: actions/upload-artifact@v7
        with:
          name: aether-gateway-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  image:
    name: Build image tar
    needs: [release_checks, frontend, gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare image context
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/aether-gateway-linux-amd64/aether-gateway dist/aether-gateway-amd64
          chmod +x dist/aether-gateway-amd64
          cp -r artifacts/frontend-dist dist/frontend

      - name: Build amd64 image tar
        run: |
          set -euo pipefail
          docker build \
            --file ./Dockerfile.app \
            --build-arg TARGETARCH=amd64 \
            --build-arg AETHER_VERSION="${GITHUB_SHA}" \
            --tag niffler-app:latest \
            --tag niffler-app:${GITHUB_SHA} \
            .
          docker save niffler-app:latest niffler-app:${GITHUB_SHA} \
            --output /tmp/niffler-app-linux-amd64.tar

      - name: Upload amd64 image tar
        uses: actions/upload-artifact@v7
        with:
          name: niffler-app-linux-amd64
          path: /tmp/niffler-app-linux-amd64.tar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to mylingweave test
    needs: image
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: test
      url: ${{ vars.MYLINGWEAVE_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate test deployment configuration
        env:
          SSH_HOST: ${{ secrets.MYLINGWEAVE_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.MYLINGWEAVE_SSH_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.MYLINGWEAVE_SSH_HOST_FINGERPRINT }}
          SSH_USER: ${{ vars.MYLINGWEAVE_USER }}
          REMOTE_DIR: ${{ vars.MYLINGWEAVE_REMOTE_DIR }}
          SOURCE_HEALTH_URL: ${{ vars.MYLINGWEAVE_SOURCE_HEALTH_URL }}
        run: |
          set -euo pipefail
          for value_name in SSH_HOST SSH_PRIVATE_KEY SSH_HOST_FINGERPRINT SSH_USER REMOTE_DIR SOURCE_HEALTH_URL; do
            if [[ -z "${!value_name}" ]]; then
              echo "${value_name} is required for the test environment" >&2
              exit 1
            fi
          done
          if [[ ! "${SSH_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "MYLINGWEAVE_USER is invalid" >&2
            exit 1
          fi
          if [[ "${REMOTE_DIR}" != "/opt/niffler-test" ]]; then
            echo "MYLINGWEAVE_REMOTE_DIR must be /opt/niffler-test" >&2
            exit 1
          fi
          if [[ ! "${SOURCE_HEALTH_URL}" =~ ^http://127\.0\.0\.1:[1-9][0-9]{0,4}/_gateway/health$ ]]; then
            echo "MYLINGWEAVE_SOURCE_HEALTH_URL must be a local /_gateway/health URL" >&2
            exit 1
          fi

      - name: Download test image artifact
        uses: actions/download-artifact@v8
        with:
          name: niffler-app-linux-amd64
          path: ${{ runner.temp }}/niffler-app-artifact

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.MYLINGWEAVE_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.MYLINGWEAVE_SSH_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.MYLINGWEAVE_SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_HOST_FINGERPRINT}" ]]; then
            echo "MYLINGWEAVE_SSH_HOST_FINGERPRINT is required" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          scan_file="$(mktemp)"
          public_key_file="$(mktemp)"
          fingerprint_file="$(mktemp)"
          trap 'rm -f "${scan_file}" "${public_key_file}" "${fingerprint_file}"' EXIT
          ssh-keyscan -H "${SSH_HOST}" > "${scan_file}"
          if [[ ! -s "${scan_file}" ]]; then
            echo "ssh-keyscan returned no host keys for ${SSH_HOST}" >&2
            exit 1
          fi

          awk 'NF >= 3 { print $2, $3 }' "${scan_file}" > "${public_key_file}"
          if [[ ! -s "${public_key_file}" ]]; then
            echo "ssh-keyscan returned no parseable public keys for ${SSH_HOST}" >&2
            exit 1
          fi

          ssh-keygen -lf "${public_key_file}" -E sha256 | awk '{print $2}' > "${fingerprint_file}"
          if [[ ! -s "${fingerprint_file}" ]]; then
            echo "failed to calculate SSH host fingerprints for ${SSH_HOST}" >&2
            exit 1
          fi
          if ! grep -Fxq -- "${SSH_HOST_FINGERPRINT}" "${fingerprint_file}"; then
            echo "SSH host fingerprint mismatch for ${SSH_HOST}" >&2
            exit 1
          fi

          install -m 600 "${scan_file}" ~/.ssh/known_hosts

      - name: Deploy image artifact
        env:
          GH_REPO: ${{ github.repository }}
          APP_IMAGE: niffler-app:${{ github.sha }}
          SOURCE_HEALTH_URL: ${{ vars.MYLINGWEAVE_SOURCE_HEALTH_URL }}
        run: |
          scripts/deploy-ci-artifact.sh \
            --host "${{ vars.MYLINGWEAVE_USER }}@${{ secrets.MYLINGWEAVE_HOST }}" \
            --remote-dir "${{ vars.MYLINGWEAVE_REMOTE_DIR }}" \
            --artifact-file "${RUNNER_TEMP}/niffler-app-artifact/niffler-app-linux-amd64.tar" \
            --test-deployment \
            --source-health-url "${SOURCE_HEALTH_URL}" \
            --public-health-url "${{ vars.MYLINGWEAVE_PUBLIC_URL }}"
