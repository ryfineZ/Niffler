name: Release Tooling CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tooling-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release_tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check script syntax
        run: |
          bash -n scripts/check-deploy-ancestry.sh
          bash -n scripts/check-promotion-source.sh
          bash -n scripts/deploy-ci-artifact.sh
          bash -n scripts/fixed-production-deployer.sh
          bash -n scripts/actions-production-ssh-command.sh
          bash -n scripts/actions-production-deploy.sh
          bash -n scripts/install-actions-production-access.sh
          bash -n scripts/verify-ssh-host-key.sh
          bash -n scripts/tests/test-deploy-ancestry.sh
          bash -n scripts/tests/test-promotion-source.sh
          bash -n scripts/tests/test-app-image-workflow.sh
          bash -n scripts/tests/test-fixed-production-deployer.sh
          bash -n scripts/tests/test-actions-production-access.sh
          bash -n scripts/tests/test-deploy-ci-restricted.sh
          bash -n scripts/tests/test-test-deploy-ci.sh
          bash -n scripts/tests/test-production-workflow.sh
          bash -n scripts/tests/test-verify-ssh-host-key.sh
          bash -n scripts/tests/test-install.sh
          bash -n scripts/tests/test-release-workflow.sh

      - name: Test deployment ancestry guard
        run: |
          bash scripts/tests/test-deploy-ancestry.sh
          bash scripts/tests/test-promotion-source.sh
          bash scripts/tests/test-app-image-workflow.sh

      - name: Test fixed production deployer
        run: bash scripts/tests/test-fixed-production-deployer.sh

      - name: Test restricted production access
        run: |
          bash scripts/tests/test-actions-production-access.sh
          bash scripts/tests/test-deploy-ci-restricted.sh
          bash scripts/tests/test-test-deploy-ci.sh
          bash scripts/tests/test-production-workflow.sh
          bash scripts/tests/test-install.sh
          bash scripts/tests/test-release-workflow.sh
          bash scripts/tests/test-verify-ssh-host-key.sh
